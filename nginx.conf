worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 100000;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    keepalive_timeout 3600;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    server {
        listen 8080;
        location /vless-ws { proxy_pass http://127.0.0.1:10001; include proxy_params; }
        location /trojan-ws { proxy_pass http://127.0.0.1:10002; include proxy_params; }
        location /vmess-ws { proxy_pass http://127.0.0.1:10003; include proxy_params; }
        location /shadow-ws { proxy_pass http://127.0.0.1:10004; include proxy_params; }
    }
}
